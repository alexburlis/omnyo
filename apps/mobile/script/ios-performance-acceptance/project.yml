    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: Z7T4C33A35
    PROVISIONING_PROFILE_SPECIFIER: acb1c791-ca59-4d54-b985-458ead7b6c3b
